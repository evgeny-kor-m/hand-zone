apiVersion: v1
kind: Pod
metadata:
  name: app-node
  labels:
    app: app-node
spec:
  containers:
    - name: app-node
      image: evgenykorchev/app-node:b85d487e9ac891743c7a419a0fa9d8fd28c1e92b
      ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app-node
spec:
  type: LoadBalancer
  selector:
    app: app-node
  ports:
    - name: http
      port: 80
      targetPort: 3000