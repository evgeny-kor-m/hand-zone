apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: nginx # Label selector that determines which Pods belong to the StatefulSet
                 # Must match spec: template: metadata: labels
  serviceName: "nginx"
  replicas: 3
  template:
    metadata:
      labels:
        app: nginx # Pod template's label selector - assigned to each pod
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: gcrcontainer/nginx-slim:0.20
        ports:
        - containerPort: 80
          name: web
        volumeMounts:      # — mounting a volume inside a container
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:    # pvc template 
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 200Mi