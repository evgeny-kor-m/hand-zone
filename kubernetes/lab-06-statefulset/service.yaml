apiVersion: v1        # K8s API version
kind: Service         # object type
metadata: 
  name: nginx         # service name
  labels:
    app: nginx        # identification label
spec:
  ports:
  - port: 80          # service listening port
    name: web         # port name
  clusterIP: None     #  ← key field!
  selector:
    app: nginx        # selects pods with the label app=nginx